<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087766">
<title>טיסה לתאילנד 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles-v4.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand">Thailand 2026 🇹🇭</div>
    <div class="tag">המסע שלי בתאילנד</div>
    <section class="calendar-countdown" aria-label="ספירה לאחור לטיסה">
      <div class="calendar-top">תאריך הטיסה</div>
      <div class="calendar-date">25.09.2026</div>
      <div id="countdownClock" class="calendar-clock">טוען...</div>
      <div class="calendar-label">עד ההמראה מנתב״ג</div>
    </section>
  </div>
</header>
<main>
  <div class="section-title"><small>המסע שלי לפי הסדר</small><h2>כל הימים</h2></div>
  <section id="journeyGrid" class="journey-grid" aria-label="ימי הטיול"></section>

  <section id="inlinePanel" class="inline-panel" aria-live="polite"></section>

  <button id="mapBanner" class="map-banner" type="button">
    <div class="copy">
      <small>🗺️ מפת הטיול שלי</small>
      <strong>כל המקומות שכבר סגרנו</strong>
      <span>מפה אינטראקטיבית עם מלונות, שדות תעופה, תחנות ופעילויות לפי מספרי המסע</span>
    </div>
  </button>

  <section id="mapSection" class="map-section" aria-live="polite">
    <div class="map-top"><div><small>מפת הטיול</small><h2>הנקודות שלי בתאילנד</h2><p>המספור הוא לפי סדר המסע. לחץ על סמן כדי לפתוח ניווט ב-Google Maps.</p></div><button id="closeMap" class="close-red" type="button">סגור</button></div>
    <div id="tripMap" class="trip-map"></div>
    <div id="mapStatus" class="map-status"></div>
    <div id="mapLegend" class="map-legend"></div>
  </section>

  <div class="section-title"><small>כלים קבועים</small><h2>שימוש מהיר</h2></div>
  <section class="tools-grid">
    <button id="mapTool" class="tool-card" type="button"><span class="ico">🗺️</span><b>מפת הטיול</b></button>
    <button id="docsTool" class="tool-card" type="button"><span class="ico">🎫</span><b>מסמכים לפי יום</b></button>
    <button id="chabadTool" class="tool-card" type="button"><span class="ico">✡️</span><b>בתי חב״ד</b></button>
    <button id="trackerTool" class="tool-card" type="button"><span class="ico">🧳</span><b>המזוודה שלי</b></button>
  </section>
</main>
<nav class="bottom-nav" aria-label="ניווט קבוע">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})" type="button"><span>⌂</span><small>בית</small></button>
  <button onclick="document.getElementById('mapTool').click()" type="button"><span>🗺️</span><small>מפה</small></button>
  <button onclick="document.getElementById('docsTool').click()" type="button"><span>🎫</span><small>מסמכים</small></button>
  <button onclick="document.getElementById('trackerTool').click()" type="button"><span>🧳</span><small>מזוודה</small></button>
  <button onclick="document.getElementById('chabadTool').click()" type="button"><span>✡️</span><small>חב״ד</small></button>
</nav>
<footer>Thailand Trip 2026</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="trip-data-v3.js"></script>
<script src="app-v4.js"></script>
</body>
</html>
