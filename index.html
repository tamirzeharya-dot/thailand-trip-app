<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f6b57">
<title>טיסה לתאילנד 2026</title>
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero"><div><div class="eyebrow">🇹🇭 THAILAND 2026</div><h1 id="appTitle"></h1><p id="appSubtitle"></p></div><div class="hero-actions"><button id="trackerBtn">🧳 המזוודה שלי</button></div></header>
<nav class="tabs"><button data-tab="route" class="active">🗺️ המסלול</button><button data-tab="bookings">🎫 הזמנות</button><button data-tab="checklist">✅ צ'ק ליסט</button><button data-tab="expenses">💰 הוצאות</button></nav>
<main>
<section id="route" class="tab-panel active"><div class="section-head"><h2>המסלול שלי</h2><div id="routeStats" class="stats"></div></div><div id="routeList" class="timeline"></div></section>
<section id="bookings" class="tab-panel"><h2>הזמנות</h2><div id="bookingList" class="grid"></div></section>
<section id="checklist" class="tab-panel"><h2>צ'ק ליסט</h2><div id="checklistList" class="stack"></div></section>
<section id="expenses" class="tab-panel"><h2>הוצאות</h2><div id="expenseSummary" class="stats"></div><div id="expenseList" class="stack"></div></section>
</main>
<footer>אפליקציית טיול לתאילנד 2026</footer>
<script src="trip-data.js"></script><script src="app.js"></script>
</body></html>
